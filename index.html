<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEPHI ASTRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main style="max-width: 680px; margin: 40px auto; padding: 0 16px;">
    
    <header style="text-align: center; margin-bottom: 32px;">
      <h1 class="app-title">SEPHI ASTRA</h1>
      <p class="section-subtitle">Celestial Guidance & Cosmic Dialogue</p>
    </header>

  <!-- 日付指定＆月間ランキング解析カード -->
    <section class="sephi-card">
      <h3 style="margin-bottom: 16px;">ピンポイント日時 ＆ 月間スコア検索</h3>
      
      <!-- ★ここに分析対象の切替ラジオボタンを追加 -->
      <div class="target-selector" style="margin-bottom: 16px; padding: 8px 12px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; display: flex; gap: 16px; align-items: center;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">✦ 分析対象:</span>
        <label style="cursor: pointer; font-size: 0.85rem; color: var(--text-primary);"><input type="radio" name="astro-target" value="global" checked style="accent-color: var(--accent-color, #a855f7);"> 地球（全体運）</label>
        <label style="cursor: pointer; font-size: 0.85rem; color: var(--text-primary);"><input type="radio" name="astro-target" value="japan" style="accent-color: var(--accent-color, #a855f7);"> 日本（世相・マンデン）</label>
      </div>

      <label style="font-size: 0.85rem; color: var(--text-secondary);">特定の日時を解読:</label>
      <input type="datetime-local" id="target-datetime" value="2026-09-09T12:00" 
             style="width: 100%; padding: 12px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary); margin-bottom: 12px;">
      
      <button id="calc-btn" class="btn-sephi-primary" style="margin-bottom: 20px;">
        ✦ この日時の星のメッセージを解読する
      </button>

      <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 16px 0;">

      <label style="font-size: 0.85rem; color: var(--text-secondary);">1ヶ月間の危険・注目の日 Top 6 を検索:</label>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="month" id="target-month" value="2026-09" 
               style="flex: 1; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
        <button id="rank-btn" class="btn-sephi-primary" style="flex: 1; font-size: 0.85rem;">月間Top6抽出</button>
      </div>
    </section>

    <!-- 解析データ＆ランキング表示カード -->
    <section class="sephi-card">
      <h3 style="margin-bottom: 12px;">データ解析結果</h3>
      <div id="data-output" style="color: var(--text-secondary); font-size: 0.9rem;">
        日時または対象月を指定してボタンを押してください。
      </div>
<!-- ここにコピーボタンを追加 -->
      <div class="copy-btn-group" style="margin-top: 15px; display: flex; gap: 8px;">
        <button id="copy-result-btn">📋 出力結果をコピー</button>
        <button id="copy-chat-btn">💬 チャットログをコピー</button>
      </div>

    </section>

    <!-- セフィとのチャット＆ログ管理カード -->
    <section class="sephi-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: var(--accent-gold-primary);">Sephi's Guidance</h3>
        <button id="clear-log-btn" style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;">
          ログを消去
        </button>
      </div>

      <!-- チャットログ表示領域 -->
      <div id="chat-container" style="max-height: 400px; overflow-y: auto; margin-bottom: 16px; padding-right: 4px;"></div>

      <!-- 自由会話メッセージ入力欄 -->
      <div style="display: flex; gap: 8px;">
        <input type="text" id="user-chat-input" placeholder="セフィにメッセージを送る..." 
               style="flex: 1; padding: 12px; border-radius: 20px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
        <button id="send-chat-btn" class="btn-sephi-primary" style="width: auto; padding: 0 20px; border-radius: 20px;">
          送信
        </button>
      </div>
    </section>

  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
