<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEPHI ASTRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main style="max-width: 680px; margin: 40px auto; padding: 0 16px;">
    
    <header style="text-align: center; margin-bottom: 32px;">
      <h1 class="app-title">SEPHI ASTRA</h1>
      <p class="section-subtitle">Celestial Guidance & Cosmic Dialogue</p>
    </header>

    <!-- 分析・星位計算設定カード -->
    <section class="sephi-card">
      <h3 style="margin-bottom: 16px;">星位計算・分析設定</h3>
      
      <!-- 分析対象の切替ラジオボタン -->
      <div class="target-selector" style="margin-bottom: 16px; padding: 8px 12px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">✦ 分析対象:</span>
        <label style="cursor: pointer; font-size: 0.85rem; color: var(--text-primary);"><input type="radio" name="astro-target" value="earth" checked style="accent-color: var(--accent-color, #a855f7);"> 地球（全体運）</label>
        <label style="cursor: pointer; font-size: 0.85rem; color: var(--text-primary);"><input type="radio" name="astro-target" value="japan" style="accent-color: var(--accent-color, #a855f7);"> 日本（世相・マンデン）</label>
        <label style="cursor: pointer; font-size: 0.85rem; color: var(--text-primary);"><input type="radio" name="astro-target" value="personal" style="accent-color: var(--accent-color, #a855f7);"> 個人ホロスコープ</label>
      </div>

      <!-- 日本選択時のみ表示する始審図切替グループ -->
      <div id="japan-chart-group" style="display: none; margin-bottom: 12px;">
        <label style="font-size: 0.85rem; color: var(--text-secondary);">✦ 日本の始審図（建国チャート）を選択:</label>
        <select id="japan-chart-type" style="width: 100%; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary); margin-top: 4px;">
          <option value="1946-10-07">1946年10月7日 15:15（日本国憲法可決説・現代日本の原点）</option>
          <option value="1889-02-11">1889年2月11日 10:30（大日本帝国憲法発布説・近代日本）</option>
          <option value="1952-04-28">1952年4月28日 22:30（主権回復説・国際社会での独立）</option>
        </select>
      </div>

      <!-- マンデン／地球・日本用入力グループ -->
      <div id="munden-input-group">
        <label style="font-size: 0.85rem; color: var(--text-secondary);">特定の日時を解読:</label>
        <input type="datetime-local" id="target-datetime" value="2026-09-09T12:00" 
               style="width: 100%; padding: 12px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary); margin-bottom: 12px;">
      </div>

      <!-- 個人ホロスコープ選択時のみ表示するグループ -->
      <div id="personal-input-group" style="display: none; flex-direction: column; gap: 10px; margin-bottom: 12px; width: 100%;">
        <label style="font-size: 0.85rem; color: var(--text-secondary);">生年月日・出生時間・出生地を入力:</label>
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <input type="date" id="birth-date" style="flex: 1; min-width: 140px; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
          <input type="time" id="birth-time" style="flex: 1; min-width: 100px; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="birth-time-unknown" style="accent-color: var(--accent-color, #a855f7);">
          <label for="birth-time-unknown" style="font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;">出生時間不明（正午12:00で計算）</label>
        </div>

        <input type="text" id="birth-location" placeholder="出生地（例: 東京都、大阪府）" 
               style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary); display: block;">
      </div>

<!-- ✦ 天体ペア指定アスペクト検索フォーム -->
<div style="margin-top: 16px; padding: 12px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; border: 1px solid var(--glass-border);">
  <strong style="font-size: 0.85rem; color: var(--accent-color, #a855f7);">✦ 天体ペア指定アスペクト検索 (T × N / T × T)</strong>
  
  <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
    <!-- 始点天体（トランジット天体） -->
    <select id="pair-planet-1" style="flex: 1; min-width: 110px; padding: 8px; border-radius: 8px; background: rgba(9, 10, 22, 0.8); border: 1px solid var(--glass-border); color: var(--text-primary);">
      <option value="Pluto">T 冥王星</option>
      <option value="Neptune">T 海王星</option>
      <option value="Uranus">T 天王星</option>
      <option value="Saturn">T 土星</option>
      <option value="Jupiter">T 木星</option>
      <option value="Mars">T 火星</option>
      <option value="Venus">T 金星</option>
      <option value="Mercury">T 水星</option>
      <option value="Sun">T 太陽</option>
    </select>

    <span style="color: var(--text-secondary); align-self: center;">×</span>

    <!-- 対象天体（ネイタル/始図天体） -->
    <select id="pair-planet-2" style="flex: 1; min-width: 110px; padding: 8px; border-radius: 8px; background: rgba(9, 10, 22, 0.8); border: 1px solid var(--glass-border); color: var(--text-primary);">
      <option value="Sun">N 太陽</option>
      <option value="Moon">N 月</option>
      <option value="Mercury">N 水星</option>
      <option value="Venus">N 金星</option>
      <option value="Mars">N 火星</option>
      <option value="Jupiter">N 木星</option>
      <option value="Saturn">N 土星</option>
    </select>
  </div>

  <!-- 検索期間とオーブ設定 -->
  <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 130px;">
      <label style="font-size: 0.75rem; color: var(--text-secondary);">検索開始月:</label>
      <input type="month" id="pair-search-start" value="2026-01" style="width: 100%; padding: 6px; border-radius: 6px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
    </div>
    <div style="flex: 1; min-width: 130px;">
      <label style="font-size: 0.75rem; color: var(--text-secondary);">検索期間:</label>
      <select id="pair-search-months" style="width: 100%; padding: 6px; border-radius: 6px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
        <option value="6">6ヶ月間</option>
        <option value="12" selected>1年間</option>
        <option value="36">3年間（長期的影響）</option>
      </select>
    </div>
    <div style="flex: 1; min-width: 80px;">
      <label style="font-size: 0.75rem; color: var(--text-secondary);">許容オーブ:</label>
      <input type="number" id="pair-orb" value="2" min="0.5" max="6" step="0.5" style="width: 100%; padding: 6px; border-radius: 6px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
    </div>
  </div>

  <!-- ★ボタン2つを横並びで配置 -->
  <div style="display: flex; gap: 8px; margin-top: 10px;">
    <button id="search-pair-aspect-btn" style="flex: 1; padding: 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); color: white; cursor: pointer; font-size: 0.8rem;">
      🔍 選択ペアのみ抽出
    </button>
    <button id="search-all-heavy-aspects-btn" style="flex: 1.2; padding: 10px; border-radius: 8px; background: linear-gradient(135deg, #a855f7, #6366f1); color: white; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem;">
      ⚡ 主要ペア一括抽出 (T土〜冥 × N太〜土)
    </button>
  </div>
</div>
      <!-- メイン解読ボタン -->
      <button id="decode-personal-btn" style="width: 100%; margin-top: 10px; padding: 10px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid #a855f7; color: white; cursor: pointer; font-weight: bold; font-size: 0.85rem;">
        ✦ この日時の星のメッセージを解読する
      </button>

      <!-- 月間抽出グループ -->
      <div id="munden-rank-group">
        <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 16px 0;">

        <label style="font-size: 0.85rem; color: var(--text-secondary);">1ヶ月間の危険・注目の日 Top 10 を検索:</label>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="month" id="target-month" value="2026-09" 
                 style="flex: 1; padding: 10px; border-radius: 10px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
          <button id="rank-btn" class="btn-sephi-primary" style="flex: 1; font-size: 0.85rem;">月間Top10抽出</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 16px 0;">

      <!-- 天体のサイン移動検出グループ -->
      <div id="sign-input-group">
        <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.85rem; color: var(--text-secondary);">
          🌌 天体のサイン移動（星座移動）検出（どのホロスコープも同じ現象）
        </label>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <input type="date" id="sign-start-date" style="padding: 8px; border-radius: 8px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
          <span style="color: var(--text-secondary);">〜</span>
          <input type="date" id="sign-end-date" style="padding: 8px; border-radius: 8px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
          <button id="sign-btn" class="btn-sephi-primary" style="padding: 8px 16px; border-radius: 12px; cursor: pointer;">
            サイン移動を抽出
          </button>
        </div>
      </div>
    </section>

    <!-- 解析データ＆ランキング表示カード -->
    <section class="sephi-card">
      <h3 style="margin-bottom: 12px;">データ解析結果</h3>
      <div id="data-output" style="color: var(--text-secondary); font-size: 0.9rem;">
        日時または対象月を指定してボタンを押してください。
      </div>

      <div class="copy-btn-group" style="margin-top: 15px; display: flex; gap: 8px;">
        <button id="copy-result-btn">📋 出力結果をコピー</button>
        <button id="copy-chat-btn">💬 チャットログをコピー</button>
      </div>
    </section>

    <!-- セフィとのチャット＆ログ管理カード -->
    <section class="sephi-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: var(--accent-gold-primary);">Sephi's Guidance</h3>
        <button id="clear-log-btn" style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;">
          ログを消去
        </button>
      </div>

      <div id="chat-container" style="max-height: 400px; overflow-y: auto; margin-bottom: 16px; padding-right: 4px;"></div>

      <div style="display: flex; gap: 8px;">
        <input type="text" id="chat-input" placeholder="セフィにメッセージを送る..." 
               style="flex: 1; padding: 12px; border-radius: 20px; background: rgba(9, 10, 22, 0.6); border: 1px solid var(--glass-border); color: var(--text-primary);">
        <button id="send-btn" class="btn-sephi-primary" style="width: auto; padding: 0 20px; border-radius: 20px;">
          送信
        </button>
      </div>
    </section>

  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
